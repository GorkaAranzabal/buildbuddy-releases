<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI Vignette</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      html, body {
        width: 100vw;
        height: 100vh;
        background: transparent !important;
        overflow: hidden;
      }

      .vignette-container {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        pointer-events: none;
        animation: fadeIn 0.4s ease-out forwards;
      }

      /* Edge glow bars - positioned exactly at screen edges */
      .edge {
        position: absolute;
        background: linear-gradient(var(--direction),
          rgba(147, 51, 234, 0.5) 0%,
          rgba(59, 130, 246, 0.3) 30%,
          transparent 100%
        );
      }

      .edge-top {
        --direction: to bottom;
        top: 0;
        left: 0;
        right: 0;
        height: 120px;
        animation: edgePulse 2s ease-in-out infinite;
      }

      .edge-bottom {
        --direction: to top;
        bottom: 0;
        left: 0;
        right: 0;
        height: 120px;
        animation: edgePulse 2s ease-in-out infinite 0.5s;
      }

      .edge-left {
        --direction: to right;
        top: 0;
        left: 0;
        bottom: 0;
        width: 120px;
        animation: edgePulse 2s ease-in-out infinite 0.25s;
      }

      .edge-right {
        --direction: to left;
        top: 0;
        right: 0;
        bottom: 0;
        width: 120px;
        animation: edgePulse 2s ease-in-out infinite 0.75s;
      }

      /* Corner glows - brighter at corners */
      .corner {
        position: absolute;
        width: 250px;
        height: 250px;
      }

      .corner-tl {
        top: 0;
        left: 0;
        background: radial-gradient(ellipse at 0% 0%,
          rgba(147, 51, 234, 0.6) 0%,
          rgba(59, 130, 246, 0.3) 40%,
          transparent 70%
        );
        animation: cornerPulse 2.5s ease-in-out infinite;
      }

      .corner-tr {
        top: 0;
        right: 0;
        background: radial-gradient(ellipse at 100% 0%,
          rgba(59, 130, 246, 0.6) 0%,
          rgba(147, 51, 234, 0.3) 40%,
          transparent 70%
        );
        animation: cornerPulse 2.5s ease-in-out infinite 0.3s;
      }

      .corner-bl {
        bottom: 0;
        left: 0;
        background: radial-gradient(ellipse at 0% 100%,
          rgba(59, 130, 246, 0.6) 0%,
          rgba(147, 51, 234, 0.3) 40%,
          transparent 70%
        );
        animation: cornerPulse 2.5s ease-in-out infinite 0.6s;
      }

      .corner-br {
        bottom: 0;
        right: 0;
        background: radial-gradient(ellipse at 100% 100%,
          rgba(147, 51, 234, 0.6) 0%,
          rgba(59, 130, 246, 0.3) 40%,
          transparent 70%
        );
        animation: cornerPulse 2.5s ease-in-out infinite 0.9s;
      }

      /* Traveling light effect along edges */
      .light-beam {
        position: absolute;
        background: linear-gradient(90deg,
          transparent 0%,
          rgba(147, 51, 234, 0.8) 40%,
          rgba(59, 130, 246, 0.9) 50%,
          rgba(147, 51, 234, 0.8) 60%,
          transparent 100%
        );
        filter: blur(8px);
      }

      .light-top {
        top: 0;
        left: 0;
        width: 300px;
        height: 6px;
        animation: travelHorizontal 3s linear infinite;
      }

      .light-bottom {
        bottom: 0;
        right: 0;
        width: 300px;
        height: 6px;
        animation: travelHorizontalReverse 3s linear infinite;
      }

      .light-left {
        top: 0;
        left: 0;
        width: 6px;
        height: 300px;
        background: linear-gradient(180deg,
          transparent 0%,
          rgba(147, 51, 234, 0.8) 40%,
          rgba(59, 130, 246, 0.9) 50%,
          rgba(147, 51, 234, 0.8) 60%,
          transparent 100%
        );
        animation: travelVertical 3s linear infinite 1.5s;
      }

      .light-right {
        bottom: 0;
        right: 0;
        width: 6px;
        height: 300px;
        background: linear-gradient(180deg,
          transparent 0%,
          rgba(59, 130, 246, 0.8) 40%,
          rgba(147, 51, 234, 0.9) 50%,
          rgba(59, 130, 246, 0.8) 60%,
          transparent 100%
        );
        animation: travelVerticalReverse 3s linear infinite 1.5s;
      }

      @keyframes edgePulse {
        0%, 100% { opacity: 0.5; }
        50% { opacity: 1; }
      }

      @keyframes cornerPulse {
        0%, 100% {
          opacity: 0.6;
          transform: scale(1);
        }
        50% {
          opacity: 1;
          transform: scale(1.05);
        }
      }

      @keyframes travelHorizontal {
        0% { transform: translateX(-300px); }
        100% { transform: translateX(100vw); }
      }

      @keyframes travelHorizontalReverse {
        0% { transform: translateX(300px); }
        100% { transform: translateX(-100vw); }
      }

      @keyframes travelVertical {
        0% { transform: translateY(-300px); }
        100% { transform: translateY(100vh); }
      }

      @keyframes travelVerticalReverse {
        0% { transform: translateY(300px); }
        100% { transform: translateY(-100vh); }
      }

      @keyframes fadeIn {
        from { opacity: 0; }
        to { opacity: 1; }
      }
    </style>
  </head>
  <body>
    <div class="vignette-container">
      <!-- Edge glows -->
      <div class="edge edge-top"></div>
      <div class="edge edge-bottom"></div>
      <div class="edge edge-left"></div>
      <div class="edge edge-right"></div>

      <!-- Corner glows -->
      <div class="corner corner-tl"></div>
      <div class="corner corner-tr"></div>
      <div class="corner corner-bl"></div>
      <div class="corner corner-br"></div>

      <!-- Traveling light beams -->
      <div class="light-beam light-top"></div>
      <div class="light-beam light-bottom"></div>
      <div class="light-beam light-left"></div>
      <div class="light-beam light-right"></div>
    </div>
  </body>
</html>
